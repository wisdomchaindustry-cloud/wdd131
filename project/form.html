<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Francis Ime">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">

            <!-- Product Name -->
            <fieldset>
                <legend>Product Name</legend>

                <label for="productName" class="visually-hidden">
                    Product Name
                </label>

                <select id="productName" name="productName" required>
                    <option value="" disabled selected>
                        Choose a Product ...
                    </option>
                </select>
            </fieldset>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating-group">

                    <label for="rating1">
                        &star;
                        <input
                            type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required>
                    </label>

                    <label for="rating2">
                        &star;&star;
                        <input
                            type="radio"
                            id="rating2"
                            name="rating"
                            value="2">
                    </label>

                    <label for="rating3">
                        &star;&star;&star;
                        <input
                            type="radio"
                            id="rating3"
                            name="rating"
                            value="3">
                    </label>

                    <label for="rating4">
                        &star;&star;&star;&star;
                        <input
                            type="radio"
                            id="rating4"
                            name="rating"
                            value="4">
                    </label>

                    <label for="rating5">
                        &star;&star;&star;&star;&star;
                        <input
                            type="radio"
                            id="rating5"
                            name="rating"
                            value="5">
                    </label>

                </div>
            </fieldset>

            <!-- Date of Installation -->
            <fieldset>
                <legend>Date of Installation</legend>

                <label for="installDate" class="visually-hidden">
                    Date of Installation
                </label>

                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required>
            </fieldset>

            <!-- Useful Features -->
            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                </legend>

                <p class="instruction">
                    (Check all that apply)
                </p>

                <label for="durability">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input
                        type="checkbox"
                        id="easeOfUse"
                        name="features"
                        value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design">
                    Design
                </label>
            </fieldset>

            <!-- Written Review -->
            <fieldset>
                <legend>
                    Written Review
                    <span class="optional">(Optional)</span>
                </legend>

                <label for="reviewText" class="visually-hidden">
                    Written Review
                </label>

                <textarea
                    id="reviewText"
                    name="reviewText"
                    rows="6"></textarea>
            </fieldset>

            <!-- User Name -->
            <fieldset>
                <legend>
                    Your Name
                    <span class="optional">(Optional)</span>
                </legend>

                <label for="userName" class="visually-hidden">
                    User Name
                </label>

                <input
                    type="text"
                    id="userName"
                    name="userName">
            </fieldset>

            <!-- Submit Button -->
            <input
                type="submit"
                value="Post Review"
                class="submit-btn">

        </form>
    </main>

    <footer>
        <p>
            &copy;<span id="currentyear"></span>
            🌺 Francis Ime 🌺 Akwa Ibom State - Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
