<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Contact WebCafe AI and send feedback about your learning experience.">

  <meta
    name="author"
    content="Francis Ime">

  <title>Contact | WebCafe AI</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="styles/style.css">

  <link
    rel="stylesheet"
    href="styles/contact.css">

  <link
    rel="stylesheet"
    href="styles/responsive.css">

  <script
    src="scripts/main.js"
    defer></script>

  <script
    src="scripts/contact.js"
    defer></script>

</head>

<body>

  <header class="header">

    <nav class="navbar">

      <div class="logo">
        WebCafe AI
      </div>

      <ul class="nav-links">

        <li>
          <a href="index.html">
            Home
          </a>
        </li>

        <li>
          <a href="assessment.html">
            Assessment
          </a>
        </li>

        <li>
          <a href="dashboard.html">
            Dashboard
          </a>
        </li>

        <li>
          <a href="contact.html">
            Contact
          </a>
        </li>

      </ul>

      <button
        id="themeToggle"
        class="theme-btn">
        🌙
      </button>

    </nav>

  </header>

  <main>

    <section class="contact-hero">

      <h1>
        Contact WebCafe AI
      </h1>

      <p>
        Have questions, suggestions, or feedback? We'd love to hear from you.
      </p>

    </section>

    <section class="contact-section">

      <form
        id="contactForm"
        class="contact-form">

        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            required>

        </div>

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        </div>

        <div class="form-group">

          <label for="subject">
            Subject
          </label>

          <select
            id="subject"
            name="subject"
            required>

            <option value="">
              Select a Subject
            </option>

            <option value="General Inquiry">
              General Inquiry
            </option>

            <option value="Career Guidance">
              Career Guidance
            </option>

            <option value="Technical Issue">
              Technical Issue
            </option>

            <option value="Feedback">
              Feedback
            </option>

          </select>

        </div>

        <div class="form-group">

          <label for="message">
            Message
          </label>

          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message here..."
            required></textarea>

        </div>

        <button
          type="submit"
          class="btn primary-btn">
          Send Message
        </button>

      </form>

      <div
        id="confirmationMessage"
        class="confirmation-message">
      </div>

    </section>

  </main>

  <footer>

    <p>
      &copy;
      <span id="currentYear"></span>
      WebCafe AI
    </p>

    <p>
      Personalized Learning & Career Guidance Platform
    </p>

    <a href="references.html">
      References
    </a>

  </footer>

</body>
</html>
