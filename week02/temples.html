<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Temple Album</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="styles/temples.css" />
  <link rel="stylesheet" href="styles/temples-large.css" />

  <!-- JavaScript -->
  <script src="scripts/temples.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">

      <h1>Temple Album</h1>

      <!-- Hamburger Menu -->
      <button id="menu-button" aria-label="Menu">
        ☰
      </button>

      <!-- Navigation -->
      <nav>
        <ul class="navigation">
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#">Old</a></li>
          <li><a href="#">New</a></li>
          <li><a href="#">Large</a></li>
          <li><a href="#">Small</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <!-- MAIN -->
  <main>

    <h2>Home</h2>

    <div class="gallery">

      <figure>
        <img src="images/San.webp" alt="San Diego California Temple" loading="lazy">
        <figcaption>San Diego California</figcaption>
      </figure>

      <figure>
        <img src="images/Rome.webp" alt="Rome Italy Temple" loading="lazy">
        <figcaption>Rome Italy</figcaption>
      </figure>

      <figure>
        <img src="images/accra.webp" alt="Accra Ghana Temple" loading="lazy">
        <figcaption>Accra Ghana</figcaption>
      </figure>

      <figure>
        <img src="images/nairobi.webp" alt="Nairobi Kenya Temple" loading="lazy">
        <figcaption>Nairobi Kenya</figcaption>
      </figure>

      <figure>
        <img src="images/salt.webp" alt="Salt Lake Temple" loading="lazy">
        <figcaption>Salt Lake Temple</figcaption>
      </figure>

      <figure>
        <img src="images/johannesburg.webp" alt="Johannesburg South Africa Temple" loading="lazy">
        <figcaption>Johannesburg South Africa</figcaption>
      </figure>

      <figure>
        <img src="images/Washington.webp" alt="Washington DC Temple" loading="lazy">
        <figcaption>Washington DC</figcaption>
      </figure>

      <figure>
        <img src="images/tokyo.webp" alt="Tokyo Japan Temple" loading="lazy">
        <figcaption>Tokyo Japan</figcaption>
      </figure>

      <figure>
        <img src="images/lagos.webp" alt="Lagos Nigeria Temple" loading="lazy">
        <figcaption>Lagos Nigeria</figcaption>
      </figure>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>

    <p>
      © <span id="currentyear"></span>
      🌸 Ime Francis 🌸 Nigeria
    </p>

    <p id="lastModified"></p>

  </footer>

</body>
</html>
