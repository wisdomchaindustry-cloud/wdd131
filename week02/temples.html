<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO META TAGS -->
  <meta
    name="description"
    content="Explore a responsive temple album featuring beautiful temples from around the world with modern web design and interactive navigation."
  />

  <meta
    name="author"
    content="Ime Francis"
  />

  <title>Temple Album</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS FILES -->
  <link rel="stylesheet" href="styles/temples.css" />
  <link rel="stylesheet" href="styles/temples-large.css" />

  <!-- JAVASCRIPT -->
  <script src="scripts/temples.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="header-container">

      <!-- SITE TITLE -->
      <h1>Temple Album</h1>

      <!-- HAMBURGER MENU -->
      <button id="menu-button" aria-label="Open Navigation Menu">
        ☰
      </button>

      <!-- NAVIGATION -->
      <nav>
        <ul class="navigation">

          <li>
            <a href="#" class="active">Home</a>
          </li>

          <li>
            <a href="#">Old</a>
          </li>

          <li>
            <a href="#">New</a>
          </li>

          <li>
            <a href="#">Large</a>
          </li>

          <li>
            <a href="#">Small</a>
          </li>

        </ul>
      </nav>

    </div>

  </header>

  <!-- MAIN CONTENT -->
  <main>

    <h2>Home</h2>

    <!-- IMAGE GALLERY -->
    <div class="gallery">

      <!-- TEMPLE 1 -->
      <figure>
        <img
          src="images/san.webp"
          alt="San Diego California Temple"
          loading="lazy"
        />
        <figcaption>San Diego California</figcaption>
      </figure>

      <!-- TEMPLE 2 -->
      <figure>
        <img
          src="images/rome.webp"
          alt="Rome Italy Temple"
          loading="lazy"
        />
        <figcaption>Rome Italy</figcaption>
      </figure>

      <!-- TEMPLE 3 -->
      <figure>
        <img
          src="images/accra.webp"
          alt="Accra Ghana Temple"
          loading="lazy"
        />
        <figcaption>Accra Ghana</figcaption>
      </figure>

      <!-- TEMPLE 4 -->
      <figure>
        <img
          src="images/nairobi.webp"
          alt="Nairobi Kenya Temple"
          loading="lazy"
        />
        <figcaption>Nairobi Kenya</figcaption>
      </figure>

      <!-- TEMPLE 5 -->
      <figure>
        <img
          src="images/salt.webp"
          alt="Salt Lake Temple"
          loading="lazy"
        />
        <figcaption>Salt Lake Temple</figcaption>
      </figure>

      <!-- TEMPLE 6 -->
      <figure>
        <img
          src="images/johannesburg.webp"
          alt="Johannesburg South Africa Temple"
          loading="lazy"
        />
        <figcaption>Johannesburg South Africa</figcaption>
      </figure>

      <!-- TEMPLE 7 -->
      <figure>
        <img
          src="images/washington.webp"
          alt="Washington DC Temple"
          loading="lazy"
        />
        <figcaption>Washington DC</figcaption>
      </figure>

      <!-- TEMPLE 8 -->
      <figure>
        <img
          src="images/tokyo.webp"
          alt="Tokyo Japan Temple"
          loading="lazy"
        />
        <figcaption>Tokyo Japan</figcaption>
      </figure>

      <!-- TEMPLE 9 -->
      <figure>
        <img
          src="images/lagos.webp"
          alt="Lagos Nigeria Temple"
          loading="lazy"
        />
        <figcaption>Lagos Nigeria</figcaption>
      </figure>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>

    <p>
      © <span id="currentyear"></span>
      🌸 Ime Francis 🌸 Nigeria
    </p>

    <p id="lastModified"></p>

  </footer>

</body>
</html>
